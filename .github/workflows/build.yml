name: Build IL2CPP Dumper Module

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game (e.g. com.example.game)"
        required: true
        type: string

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整git历史，有助于版本信息
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'
        cache: gradle
        
    - name: Build Module
      run: |
        # 设置执行权限
        chmod +x ./gradlew
        
        # 使用更安全的sed命令替换
        sed -i.bak \
          -e 's|moduleDescription = "|moduleDescription = "(${{ github.event.inputs.package_name }}) |' \
          -e "s|com.game.packagename|${{ github.event.inputs.package_name }}|" \
          module.gradle module/src/main/cpp/game.h
        
        # 显示修改后的关键文件差异
        git --no-pager diff module.gradle module/src/main/cpp/game.h || true
        
        # 带缓存清理的构建
        ./gradlew :module:assembleRelease --build-cache --no-daemon
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper-${{ github.run_id }}
        path: out/magisk_module_release/
        retention-days: 7